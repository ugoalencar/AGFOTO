  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: ag-fotografia-prometheus
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - ag-fotografia-prometheus:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - ag-network
  #   restart: unless-stopped

  # ============================================
  # Monitoring - Grafana (Optional)
  # ============================================
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: ag-fotografia-grafana
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
  #   volumes:
  #     - ag-fotografia-grafana:/var/lib/grafana
