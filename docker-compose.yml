  #   volumes:
  #     - ag-fotografia-db:/var/lib/postgresql/data
  #   networks:
  #     - ag-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U agfoto"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================
  # Monitoring - Prometheus (Optional)
