networks:
  ag-network:
    driver: bridge

volumes:
  ag-fotografia-dados:
    driver: local
  ag-fotografia-images:
    driver: local
  ag-fotografia-logs:
    driver: local
  # ag-fotografia-db:
  #   driver: local
  # ag-fotografia-prometheus:
  #   driver: local
  # ag-fotografia-grafana:
  #   driver: local

# ============================================
# Usage:
#
# Build and run:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f app
#
# Stop all:
#   docker-compose down
#
# Stop and remove volumes:
#   docker-compose down -v
#
# Rebuild:
#   docker-compose up -d --build
#
# ============================================
