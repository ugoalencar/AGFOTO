version: '3.9'

services:
  # ============================================
  # AG Fotografia Main Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ag-fotografia-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Optional ADSET config
      ADSET_MODE: mock
      # ADSET_EMAIL: seu@email.com
      # ADSET_PASSWORD: sua_senha
    volumes:
      # Persist operational data
      - ag-fotografia-dados:/app/dados
      - ag-fotografia-images:/app/images
      - ag-fotografia-logs:/app/logs
      # Optional: Mount from host for development
      # - ./dados:/app/dados
      # - ./images:/app/images
    networks:
      - ag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # PostgreSQL Database (Optional - Future v1.1)
